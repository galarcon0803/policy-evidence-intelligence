# Local candidate filter for Congress.gov bills. The API's bill list has no keyword
# search and does not return policy area, so only titles can be matched at this stage.
# Matching is case-insensitive on word boundaries. This is a recall-oriented filter:
# its misses are measured using filter-rejected bills in the eval sample.

pillars:
  electricity_affordability:
    - data center
    - data centre
    - large load
    - ratepayer
    - rate payer
    - electricity rate
    - electricity price
    - electricity cost
    - electric bill
    - utility bill
    - energy affordability
    - low income home energy
    - LIHEAP
    - grid
    - transmission
    - interconnection
    - power plant
    - electric reliability
    - permitting reform
  data_centers_communities:
    - data center
    - data centre
    - hyperscale
    - computing facility
    - computing infrastructure
    - AI infrastructure
    - artificial intelligence infrastructure
    - water use
    - noise
  education_learning:
    - education technology
    - edtech
    - AI literacy
    - artificial intelligence literacy
    - digital literacy
    - AI in education
    - artificial intelligence in education
    - computer science education
    - student data
    - school
  jobs_skills:
    - workforce
    - apprenticeship
    - job training
    - displacement
    - displaced worker
    - reskilling
    - upskilling
    - automation
    - AI workforce
    - labor market

# A bill mentioning AI generally goes through classification for all pillars.
cross_cutting:
  - artificial intelligence
  - machine learning
  - automated decision
  - generative AI
  - frontier model
  - "AI"

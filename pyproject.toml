[project]
name = "policy-evidence-intelligence"
version = "0.1.0"
description = "Independent prototype: policy intelligence, governed metrics, and causal evaluation on electricity affordability and data centers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "duckdb>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
